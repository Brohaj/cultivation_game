<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Места Пути Культиватора</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1718;color:#e5e6da;font:16px/1.55 system-ui,sans-serif}main{max-width:1320px;margin:auto;padding:36px 24px 64px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid #314341;padding-bottom:22px}h1{font:500 34px/1.2 Georgia,serif;margin:4px 0 12px}p{color:#a9bfba;margin:0}small{color:#91b3a2;letter-spacing:.12em}a{color:#cdddba}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button{padding:9px 17px;border:1px solid #385149;border-radius:6px;background:#152726;color:#c7d6cd;font:inherit;cursor:pointer}button.active{background:#305143;border-color:#84ae95;color:#f1f4e9}h2{font:500 25px/1.2 Georgia,serif;margin:32px 0 16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{display:block;background:#172725;border:1px solid #324640;border-radius:9px;overflow:hidden;text-decoration:none}.card img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover}.caption{padding:13px 15px}.caption span{display:block;color:#a4b8ac;font-size:12px;margin-bottom:3px}.caption strong{font-size:16px;font-weight:500}footer{margin-top:36px;padding-top:20px;border-top:1px solid #314341;color:#a9bfba;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{display:block}header>a{display:inline-block;margin-top:16px}}@media(max-width:520px){main{padding:24px 14px}.grid{grid-template-columns:1fr}h1{font-size:28px}}
</style></head><body><main><header><div><small>ПУТЬ КУЛЬТИВАТОРА</small><h1>Места, в которых живёт история</h1><p>30 иллюстраций: походы, их улучшения и пять сект.</p></div><a href="../../index-v2.html">Открыть игру ↗</a></header><nav aria-label="Виды иллюстраций"></nav><div id="gallery"></div><footer>Нажмите на изображение, чтобы открыть его целиком. Единая серия рисованных пейзажей сянься.</footer></main>
<script>
const groups=[{"name":"Лес Духовных Трав","type":"Походы","entries":[{"src":"expeditions/spirit_forest-0.webp","title":"Лес Духовных Трав","stage":"Начальная локация"},{"src":"expeditions/spirit_forest-1.webp","title":"Сердце Древнего Леса","stage":"1-е улучшение"},{"src":"expeditions/spirit_forest-2.webp","title":"Корень Мира","stage":"2-е улучшение"}]},{"name":"Пещера Древнего Зверя","type":"Походы","entries":[{"src":"expeditions/beast_cave-0.webp","title":"Пещера Древнего Зверя","stage":"Начальная локация"},{"src":"expeditions/beast_cave-1.webp","title":"Логово Праотца Зверей","stage":"1-е улучшение"},{"src":"expeditions/beast_cave-2.webp","title":"Охотничьи Угодья Праотца","stage":"2-е улучшение"}]},{"name":"Руины Забытой Секты","type":"Походы","entries":[{"src":"expeditions/forgotten_ruins-0.webp","title":"Руины Забытой Секты","stage":"Начальная локация"},{"src":"expeditions/forgotten_ruins-1.webp","title":"Запретный Архив Секты","stage":"1-е улучшение"},{"src":"expeditions/forgotten_ruins-2.webp","title":"Тайна Совета Девяти","stage":"2-е улучшение"}]},{"name":"Небесный Аукцион","type":"Походы","entries":[{"src":"expeditions/heavenly_auction-0.webp","title":"Небесный Аукцион","stage":"Начальная локация"},{"src":"expeditions/heavenly_auction-1.webp","title":"Небесный Чёрный Рынок","stage":"1-е улучшение"}]},{"name":"Бездна Демонов","type":"Походы","entries":[{"src":"expeditions/demon_abyss-0.webp","title":"Бездна Демонов","stage":"Начальная локация"},{"src":"expeditions/demon_abyss-1.webp","title":"Сердце Бездны","stage":"1-е улучшение"}]},{"name":"Дворец Павшего Бессмертного","type":"Походы","entries":[{"src":"expeditions/immortal_palace-0.webp","title":"Дворец Павшего Бессмертного","stage":"Начальная локация"},{"src":"expeditions/immortal_palace-1.webp","title":"Тронный Зал Бессмертного","stage":"1-е улучшение"}]},{"name":"Пять сект","type":"Секты","entries":[{"src":"sects/jade_purity.webp","title":"Нефритовая Чистота","stage":"Обитель секты"},{"src":"sects/crimson_flame.webp","title":"Алое Пламя","stage":"Обитель секты"},{"src":"sects/moon_lake.webp","title":"Лунное Озеро","stage":"Обитель секты"},{"src":"sects/abyss_cult.webp","title":"Культ Бездны","stage":"Обитель секты"},{"src":"sects/hidden_hermit.webp","title":"Скрытая Секта","stage":"Обитель секты"}]},{"name":"Нефритовая Чистота","type":"Царства сект","entries":[{"src":"expeditions/sect-jade_purity-0.webp","title":"Тайное Царство Секты","stage":"Тайное царство"},{"src":"expeditions/sect-jade_purity-1.webp","title":"Истинное Царство Секты","stage":"Улучшенное царство"}]},{"name":"Алое Пламя","type":"Царства сект","entries":[{"src":"expeditions/sect-crimson_flame-0.webp","title":"Тайное Царство Секты","stage":"Тайное царство"},{"src":"expeditions/sect-crimson_flame-1.webp","title":"Истинное Царство Секты","stage":"Улучшенное царство"}]},{"name":"Лунное Озеро","type":"Царства сект","entries":[{"src":"expeditions/sect-moon_lake-0.webp","title":"Тайное Царство Секты","stage":"Тайное царство"},{"src":"expeditions/sect-moon_lake-1.webp","title":"Истинное Царство Секты","stage":"Улучшенное царство"}]},{"name":"Культ Бездны","type":"Царства сект","entries":[{"src":"expeditions/sect-abyss_cult-0.webp","title":"Тайное Царство Секты","stage":"Тайное царство"},{"src":"expeditions/sect-abyss_cult-1.webp","title":"Истинное Царство Секты","stage":"Улучшенное царство"}]},{"name":"Скрытая Секта","type":"Царства сект","entries":[{"src":"expeditions/sect-hidden_hermit-0.webp","title":"Тайное Царство Секты","stage":"Тайное царство"},{"src":"expeditions/sect-hidden_hermit-1.webp","title":"Истинное Царство Секты","stage":"Улучшенное царство"}]}];
const categories=["Походы","Секты","Царства сект","Все"];
function render(category){
document.querySelector("nav").innerHTML=categories.map(type=>'<button type="button" class="'+(type===category?'active':'')+'" aria-pressed="'+(type===category)+'">'+type+'</button>').join('');
document.getElementById("gallery").innerHTML=groups.filter(group=>category==="Все"||group.type===category).map(group=>'<section><h2>'+group.name+'</h2><div class="grid">'+group.entries.map(item=>'<a class="card" href="'+item.src+'" target="_blank" rel="noopener"><img src="'+item.src+'" alt="'+item.title+'" width="1024" height="683" loading="lazy" decoding="async"><div class="caption"><span>'+item.stage+'</span><strong>'+item.title+'</strong></div></a>').join('')+'</div></section>').join('');
document.querySelectorAll("nav button").forEach(button=>button.onclick=()=>render(button.textContent));
}render("Походы");
</script></body></html>
